[project]
name = "vam-mcp"
version = "0.10.4"
description = "Unofficial MCP server for Virt-A-Mate scene, look, clothing, pose, expression, and placement control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VamMcp contributors" }]
keywords = ["mcp", "virt-a-mate", "vam"]
dependencies = [
  "mcp>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/rainbowsteins/VaMMCP"

[project.scripts]
vam-mcp = "vam_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vam_mcp"]
